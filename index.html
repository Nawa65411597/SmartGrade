  </head>
  <body class="font-sans antialiased bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback: If deployed directly on Cloudflare Pages or static host without build step,
      // gracefully redirect to the pre-built bundle in /dist/
      if (typeof window !== 'undefined' && location.hostname.includes('pages.dev') && !location.pathname.startsWith('/dist')) {
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('module script') !== -1 || e.message.indexOf('MIME type') !== -1)) {
            console.warn('Switching to production bundle in /dist/');
            location.replace('/dist' + (location.pathname === '/' ? '/index.html' : location.pathname));
          }
        }, true);
      }
    </script>
  </body>
